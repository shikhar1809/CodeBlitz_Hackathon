<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live location</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --page:#FAF7FC; --card:#fff; --text:#241519; --text2:#6E5A5F; --plum:#6B2A55;
            --green:#3DBE7B; --orange:#FF8A00; --red:#E5383B; --yellow:#FFD400; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--page); color: var(--text); }
    .bar { height: 5px; background: var(--green); transition: background .3s; }
    main { max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin: 8px 0 2px; }
    .sub { color: var(--text2); margin: 0 0 14px; }
    .card { background: var(--card); border-radius: 22px; padding: 16px;
            box-shadow: 0 6px 18px rgba(16,20,24,.08); margin-bottom: 12px; }
    #map { height: 340px; border-radius: 22px; overflow: hidden; margin-bottom: 12px; }
    .status { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; }
    .dot { width:12px; height:12px; border-radius:50%; background: var(--green); }
    .row { display:flex; gap:12px; }
    .row .card { flex:1; }
    .k { color: var(--text2); font-size: 13px; }
    .v { font-weight: 800; font-size: 18px; }
    .btn { display:block; text-align:center; text-decoration:none; color:#fff; background: var(--red);
           padding: 15px; border-radius: 16px; font-weight: 700; margin-bottom: 10px; }
    .btn.alt { background: var(--plum); }
    ul { list-style:none; padding:0; margin:0; }
    li { padding: 4px 0; font-size: 14px; }
    li span { color: var(--text2); display:inline-block; width: 74px; }
    .foot { color: var(--text2); font-size: 12px; text-align:center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <main>
    <h1 id="title">Live location</h1>
    <p class="sub" id="sub">Loading…</p>
    <div class="card"><div class="status"><div class="dot" id="dot"></div><div id="status">…</div></div></div>
    <div id="map"></div>
    <div class="row">
      <div class="card"><div class="k">Last check-in</div><div class="v" id="beat">—</div></div>
      <div class="card"><div class="k">Started</div><div class="v" id="started">—</div></div>
    </div>
    <a class="btn" href="tel:112">Call 112</a>
    <a class="btn alt" id="maps" href="#" target="_blank" rel="noopener">Open in Google Maps</a>
    <div class="card"><div class="k" style="margin-bottom:6px">What happened</div><ul id="notes"></ul></div>
    <p class="foot">Shared by Winger only while a session runs. Winger helps get help faster; it is not a guarantee of safety. In danger, call 112.</p>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const id = location.pathname.split('/').filter(Boolean).pop();
    const $ = (x) => document.getElementById(x);
    const map = L.map('map', { zoomControl: false }).setView([26.8485, 80.942], 14);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    const line = L.polyline([], { color: '#6B2A55', weight: 5 }).addTo(map);
    const me = L.circleMarker([0, 0], { radius: 9, color: '#fff', weight: 3, fillColor: '#2F6BEA', fillOpacity: 1 });
    let fitted = false;
    const t = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const ago = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? s + 's ago' : Math.round(s / 60) + ' min ago'; };
    const look = {
      watching: ['var(--green)', 'All quiet. Winger is watching.'],
      checking: ['var(--orange)', 'Winger is checking on her.'],
      alerting: ['var(--red)', 'She may need help. Call her or 112.'],
      silent:   ['var(--yellow)', 'Silent alert. Do not call her; go to her or call 112.'],
      safe:     ['var(--green)', 'She is safe. Session ended.'],
      ended:    ['var(--text2)', 'Session ended.'],
    };
    async function load() {
      try {
        const r = await fetch('/api/track/' + id, { cache: 'no-store' });
        if (!r.ok) { $('sub').textContent = 'This link has expired or is wrong.'; return; }
        const d = await r.json();
        $('title').textContent = d.name;
        $('sub').textContent = d.kind === 'journey' ? 'is on a journey' : 'has Winger on';
        let [color, text] = look[d.status] || look.watching;
        if (d.dark) { color = 'var(--red)'; text = 'Her phone stopped checking in at ' + t(d.darkAt) + '. Call her now.'; }
        $('bar').style.background = color; $('dot').style.background = color; $('status').textContent = text;
        $('beat').textContent = ago(d.now - d.lastBeat);
        $('started').textContent = t(d.startedAt);
        const pts = (d.trail || []).map((p) => [p.lat, p.lon]);
        line.setLatLngs(pts);
        if (d.location) {
          me.setLatLng([d.location.lat, d.location.lon]).addTo(map);
          $('maps').href = 'https://maps.google.com/?q=' + d.location.lat + ',' + d.location.lon;
          if (!fitted) { pts.length > 1 ? map.fitBounds(line.getBounds(), { padding: [30, 30] }) : map.setView([d.location.lat, d.location.lon], 16); fitted = true; }
        }
        $('notes').innerHTML = '';
        (d.notes || []).slice().reverse().forEach((n) => {
          const li = document.createElement('li');
          const s = document.createElement('span'); s.textContent = t(n.at);
          li.appendChild(s); li.appendChild(document.createTextNode(n.text));
          $('notes').appendChild(li);
        });
      } catch (e) { $('sub').textContent = 'Reconnecting…'; }
    }
    load(); setInterval(load, 5000);
  </script>
</body>
</html>
